<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF7FD">
<title>Sumly: math quiz and sums</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sumly">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Palette lives here: swap these values to restyle the whole app. */
:root{
  --bg:#EEF7FD; --ink:#1F3B5C; --muted:#52708F;
  --accent:#2F73C9; --accent2:#7FD3F0; --peach:#F8DDB3;
  --good:#1F8F6B; --bad:#C94762;
  --good-bg:rgba(79,191,154,.28); --bad-bg:rgba(232,120,138,.28);
  --glass:rgba(255,255,255,.48); --glass-b:rgba(255,255,255,.8);
  --sh-d:rgba(120,165,205,.45); --sh-l:rgba(255,255,255,.95);
  --blob:1; color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#152234; --ink:#E6F1FB; --muted:#9DB5CD; --accent:#8EC5F5;
    --good:#5FD3AE; --bad:#FF8A9C;
    --glass:rgba(255,255,255,.07); --glass-b:rgba(255,255,255,.15);
    --sh-d:rgba(0,0,0,.5); --sh-l:rgba(255,255,255,.05); --blob:.55; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#152234; --ink:#E6F1FB; --muted:#9DB5CD; --accent:#8EC5F5;
  --good:#5FD3AE; --bad:#FF8A9C;
  --glass:rgba(255,255,255,.07); --glass-b:rgba(255,255,255,.15);
  --sh-d:rgba(0,0,0,.5); --sh-l:rgba(255,255,255,.05); --blob:.55; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Outfit",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  -webkit-user-select:none; user-select:none; overscroll-behavior:none;
}
.bg{position:fixed;inset:0;opacity:var(--blob);pointer-events:none;
  background:
   radial-gradient(60% 40% at 10% 6%,#CBE5FC,transparent 72%),
   radial-gradient(50% 36% at 95% 30%,#DAF4FD,transparent 72%),
   radial-gradient(60% 38% at 70% 98%,#F8DDB3,transparent 72%)}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:22px 18px 28px}
h1{font-size:40px;line-height:1.05;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 12px}
.sub{margin:0 0 22px;color:var(--muted);font-size:17px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:disabled{cursor:default}
.glass{background:var(--glass);border:1px solid var(--glass-b);border-radius:28px;
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 14px 34px -16px var(--sh-d),inset 0 1px 0 var(--glass-b)}
.card{padding:18px;margin-bottom:16px}
.soft{background:var(--bg);box-shadow:6px 6px 14px var(--sh-d),-6px -6px 14px var(--sh-l);border-radius:20px;transition:box-shadow .15s}
.soft:active:not(:disabled),.soft.on{box-shadow:inset 4px 4px 10px var(--sh-d),inset -4px -4px 10px var(--sh-l)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chip{min-height:52px;font-weight:600;font-size:17px;padding:0 12px}
.chip.on{color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.seg button{min-height:48px;font-weight:600;font-size:16px;border-radius:16px}
.seg button.on{color:var(--accent)}
.mode{display:block;width:100%;text-align:left;padding:18px 20px;margin-bottom:14px;border-radius:26px;color:#fff;
  background:linear-gradient(135deg,#2A69BD,#4E96E3);box-shadow:0 14px 26px -14px rgba(42,105,189,.85),inset 0 1px 0 rgba(255,255,255,.4)}
.mode.alt{background:linear-gradient(135deg,#F8DDB3,#FCEBD0);color:#47330F;box-shadow:0 14px 26px -14px rgba(214,160,90,.8),inset 0 1px 0 rgba(255,255,255,.6)}
.mode:active{transform:scale(.985)}
.mode b{display:block;font-size:22px}
.mode span{display:block;font-size:15px;opacity:.92;margin-top:2px}
.mode em{display:block;font-style:normal;font-size:14px;margin-top:8px;opacity:.9}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;font-weight:600}
.pill{min-height:44px;padding:0 18px;border-radius:999px;font-size:15px}
.count{color:var(--muted);font-size:15px}
.track{height:10px;border-radius:99px;background:var(--bg);box-shadow:inset 2px 2px 5px var(--sh-d),inset -2px -2px 5px var(--sh-l);overflow:hidden;margin-bottom:18px}
.track i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s}
.qcard{padding:30px 16px;text-align:center;margin-bottom:10px}
.q{font-size:clamp(34px,10vw,48px);font-weight:700;letter-spacing:-.01em;word-break:keep-all}
.q.in{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.fb{min-height:28px;margin:6px 0 10px;text-align:center;font-weight:600;font-size:17px}
.fb.ok{color:var(--good)} .fb.bad{color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.opt{min-height:68px;font-size:26px;font-weight:700;border-radius:22px;border:2px solid transparent}
.opt:disabled{color:var(--ink)}
.opt.ok{background:var(--good-bg);border-color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.disp{min-height:60px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;border-radius:20px;margin-bottom:14px;
  background:var(--bg);box-shadow:inset 4px 4px 10px var(--sh-d),inset -4px -4px 10px var(--sh-l);border:2px solid transparent}
.disp.ph{color:var(--muted)} .disp.ok{border-color:var(--good);color:var(--good)} .disp.bad{border-color:var(--bad);color:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.key{min-height:54px;font-size:24px;font-weight:600}
.primary{display:block;width:100%;min-height:58px;border-radius:22px;font-size:19px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#2A69BD,#4E96E3);box-shadow:0 14px 26px -14px rgba(42,105,189,.85),inset 0 1px 0 rgba(255,255,255,.4)}
.primary:disabled{opacity:.45;box-shadow:none}
.primary.off{visibility:hidden}
.big{font-size:64px;font-weight:700;text-align:center;margin:6px 0 4px}
.msg{text-align:center;font-size:19px;margin:0 0 4px}
.best{text-align:center;color:var(--muted);margin:0 0 18px}
.rev{margin:0 0 16px;padding:16px 18px 16px 38px;font-size:16px;line-height:1.7}
.rev li::marker{color:var(--bad)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row .soft{min-height:56px;font-weight:700;font-size:17px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:700px){.qcard{padding:20px 12px}.key{min-height:48px}.pad{gap:10px}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="app">

<section id="home">
  <h1>Sumly</h1>
  <p class="sub">Quick math, one question at a time.</p>
  <div class="glass card">
    <h2>Operations</h2>
    <div class="chips" id="ops">
      <button class="soft chip on" data-op="+" aria-pressed="true">+ Add</button>
      <button class="soft chip on" data-op="-" aria-pressed="true">− Subtract</button>
      <button class="soft chip" data-op="*" aria-pressed="false">× Multiply</button>
      <button class="soft chip" data-op="/" aria-pressed="false">÷ Divide</button>
    </div>
  </div>
  <div class="glass card">
    <h2>Level</h2>
    <div class="seg" id="lv">
      <button class="soft on" data-lv="easy" aria-pressed="true">Easy</button>
      <button class="soft" data-lv="medium" aria-pressed="false">Medium</button>
      <button class="soft" data-lv="hard" aria-pressed="false">Hard</button>
    </div>
  </div>
  <button class="mode" data-mode="quiz"><b>Start quiz</b><span>Pick the right answer from four choices</span><em id="bq"></em></button>
  <button class="mode alt" data-mode="sums"><b>Start sums</b><span>Type your own answer on the keypad</span><em id="bs"></em></button>
</section>

<section id="play" hidden>
  <div class="top">
    <button class="soft pill" id="quit">Quit</button>
    <span class="count" id="cnt"></span>
    <span class="count" id="sc"></span>
  </div>
  <div class="track"><i id="bar"></i></div>
  <div class="glass qcard"><div class="q" id="q"></div></div>
  <p class="fb" id="fb" role="status" aria-live="polite"></p>
  <div class="opts" id="opts"></div>
  <div id="sumsbox" hidden>
    <div class="disp ph" id="disp">?</div>
    <div class="pad" id="pad"></div>
  </div>
  <button class="primary" id="act"></button>
</section>

<section id="result" hidden>
  <h1>Round done</h1>
  <div class="glass card">
    <div class="big" id="rs"></div>
    <p class="msg" id="rm"></p>
    <p class="best" id="rb"></p>
  </div>
  <div id="revbox" hidden>
    <h2>Worth another look</h2>
    <ol class="glass rev" id="rev"></ol>
  </div>
  <div class="row">
    <button class="soft" id="again">Play again</button>
    <button class="soft" id="home2">Home</button>
  </div>
</section>

</main>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const SYM={'+':'+','-':'−','*':'×','/':'÷'};
const N=10;
const st={mode:'quiz',level:'easy',ops:['+','-'],qs:[],i:0,score:0,wrong:[],input:'',done:false};

const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const load=()=>{try{return JSON.parse(localStorage.getItem('sumly-best')||'{}')||{}}catch(e){return {}}};
const save=o=>{try{localStorage.setItem('sumly-best',JSON.stringify(o))}catch(e){}};

function make(op,lv){
  const add={easy:20,medium:100,hard:1000}[lv];
  const mA={easy:5,medium:12,hard:20}[lv];
  const mB={easy:5,medium:12,hard:12}[lv];
  let a,b,c;
  if(op==='+'){a=rnd(2,add);b=rnd(2,add);return{t:a+' + '+b,a:a+b}}
  if(op==='-'){a=rnd(3,add);b=rnd(1,a);return{t:a+' − '+b,a:a-b}}
  if(op==='*'){a=rnd(2,mA);b=rnd(2,mB);return{t:a+' × '+b,a:a*b}}
  b=rnd(2,mB);c=rnd(2,mA);return{t:(b*c)+' ÷ '+b,a:c}
}
function build(){
  const qs=[],seen=new Set();let g=0;
  while(qs.length<N){
    const q=make(st.ops[rnd(0,st.ops.length-1)],st.level);
    if(seen.has(q.t)&&g++<200)continue;
    seen.add(q.t);qs.push(q);
  }
  return qs;
}
function choices(a){
  const s=new Set([a]),sp=Math.max(3,Math.round(a*.2));let g=0;
  while(s.size<4&&g++<60){const v=a+rnd(1,sp)*(Math.random()<.5?-1:1);if(v>=0)s.add(v)}
  let k=1;while(s.size<4)s.add(a+k++);
  return shuffle([...s]);
}
function show(id){['home','play','result'].forEach(s=>{$('#'+s).hidden=s!==id});window.scrollTo(0,0)}

function bests(){
  const d=load(),f=m=>{const v=d[m+'-'+st.level];return 'Best on '+st.level+': '+(typeof v==='number'?v+' / '+N:'not played yet')};
  $('#bq').textContent=f('quiz');$('#bs').textContent=f('sums');
}

/* Home controls */
$('#ops').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  const op=b.dataset.op,i=st.ops.indexOf(op);
  if(i>-1){if(st.ops.length===1)return;st.ops.splice(i,1)}else st.ops.push(op);
  const on=st.ops.includes(op);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);
});
$('#lv').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  st.level=b.dataset.lv;
  document.querySelectorAll('#lv button').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});
  bests();
});
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>start(b.dataset.mode)));
$('#quit').addEventListener('click',()=>{bests();show('home')});
$('#home2').addEventListener('click',()=>{bests();show('home')});
$('#again').addEventListener('click',()=>start(st.mode));

/* Keypad */
const pad=$('#pad');
['1','2','3','4','5','6','7','8','9','C','0','B'].forEach(k=>{
  const b=document.createElement('button');
  b.className='soft key';b.dataset.k=k;
  b.textContent=k==='B'?'⌫':k;
  b.setAttribute('aria-label',k==='B'?'Delete':k==='C'?'Clear':k);
  pad.appendChild(b);
});
pad.addEventListener('click',e=>{const b=e.target.closest('.key');if(b)press(b.dataset.k)});
function press(k){
  if(st.done||st.mode!=='sums')return;
  if(k==='C')st.input='';
  else if(k==='B')st.input=st.input.slice(0,-1);
  else if(st.input.length<7)st.input=st.input==='0'?k:st.input+k;
  const d=$('#disp');d.textContent=st.input||'?';d.className='disp'+(st.input?'':' ph');
  $('#act').disabled=st.input==='';
}

/* Game flow */
function start(mode){
  st.mode=mode;st.qs=build();st.i=0;st.score=0;st.wrong=[];
  show('play');render();
}
function render(){
  const q=st.qs[st.i];
  st.done=false;st.input='';
  $('#cnt').textContent=(st.i+1)+' of '+N;
  $('#sc').textContent='Score '+st.score;
  $('#bar').style.width=(st.i/N*100)+'%';
  const qe=$('#q');qe.textContent=q.t+' = ?';qe.classList.remove('in');void qe.offsetWidth;qe.classList.add('in');
  const fb=$('#fb');fb.textContent='';fb.className='fb';
  const act=$('#act');
  if(st.mode==='quiz'){
    $('#sumsbox').hidden=true;$('#opts').hidden=false;
    const o=$('#opts');o.textContent='';
    choices(q.a).forEach(v=>{
      const b=document.createElement('button');
      b.className='soft opt';b.dataset.v=v;b.textContent=v;
      b.addEventListener('click',()=>answer(v));
      o.appendChild(b);
    });
    act.className='primary off';act.disabled=true;act.textContent='Next';
  }else{
    $('#opts').hidden=true;$('#sumsbox').hidden=false;
    const d=$('#disp');d.textContent='?';d.className='disp ph';
    pad.querySelectorAll('.key').forEach(k=>k.disabled=false);
    act.className='primary';act.disabled=true;act.textContent='Check';
  }
}
function answer(val){
  if(st.done)return;
  st.done=true;
  const q=st.qs[st.i],ok=val===q.a;
  if(ok)st.score++;else st.wrong.push({t:q.t,a:q.a,u:val});
  $('#sc').textContent='Score '+st.score;
  $('#bar').style.width=((st.i+1)/N*100)+'%';
  const fb=$('#fb');
  fb.textContent=ok?'Correct!':'Not quite. The answer is '+q.a+'.';
  fb.className='fb '+(ok?'ok':'bad');
  if(st.mode==='quiz'){
    $('#opts').querySelectorAll('.opt').forEach(b=>{
      const v=+b.dataset.v;b.disabled=true;
      if(v===q.a)b.classList.add('ok');else if(v===val)b.classList.add('bad');
    });
  }else{
    $('#disp').className='disp '+(ok?'ok':'bad');
    pad.querySelectorAll('.key').forEach(k=>k.disabled=true);
  }
  const act=$('#act');
  act.className='primary';act.disabled=false;
  act.textContent=st.i===N-1?'See results':'Next';
}
function onAct(){
  if(!st.done){if(st.mode==='sums'&&st.input!=='')answer(parseInt(st.input,10));return}
  st.i++;
  if(st.i>=N)finish();else render();
}
$('#act').addEventListener('click',onAct);

function finish(){
  const d=load(),key=st.mode+'-'+st.level,prev=typeof d[key]==='number'?d[key]:-1;
  const isBest=st.score>prev;
  if(isBest){d[key]=st.score;save(d)}
  const p=st.score/N*100;
  $('#rs').textContent=st.score+' / '+N;
  $('#rm').textContent=p>=90?'Brilliant work.':p>=70?'Nicely done.':p>=40?'Getting there. A little more practice will help.':'Every round makes you quicker. Try again.';
  $('#rb').textContent=isBest?'New best for '+st.mode+' on '+st.level+'!':'Best for '+st.mode+' on '+st.level+': '+prev+' / '+N;
  const rev=$('#rev');rev.textContent='';
  st.wrong.forEach(w=>{
    const li=document.createElement('li');
    li.textContent=w.t+' = '+w.a+'  (you answered '+w.u+')';
    rev.appendChild(li);
  });
  $('#revbox').hidden=st.wrong.length===0;
  show('result');
}

/* Keyboard support for desktop and Bluetooth keyboards */
document.addEventListener('keydown',e=>{
  if($('#play').hidden||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Enter'){e.preventDefault();if(!$('#act').disabled)onAct();return}
  if(st.done)return;
  if(st.mode==='sums'){
    if(/^[0-9]$/.test(e.key))press(e.key);
    else if(e.key==='Backspace')press('B');
  }else if(/^[1-4]$/.test(e.key)){
    const b=$('#opts').children[+e.key-1];if(b)b.click();
  }
});

bests();
})();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
